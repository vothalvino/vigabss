# =============================================================================
# FireISP 5.0 — Production docker-compose
# =============================================================================
#
# Services:
#   • db-primary  — MySQL 8.4 write node (with binary log + GTID)
#   • db-replica  — MySQL 8.4 read replica (async streaming replication)
#   • redis       — Redis 7 (AOF persistence, password-protected)
#   • app         — FireISP Node.js API + React SPA (can be scaled with
#                   `docker compose -f docker-compose.prod.yml up --scale app=3`)
#   • wireguard-helper — isolated kernel-networking helper (GUI controlled)
#   • nginx       — Nginx reverse proxy (HTTP→HTTPS redirect, TLS, gzip,
#                   rate limiting, WebSocket pass-through for FireRelay)
#
# Prerequisites:
#   1. Copy .env.prod.example → .env.prod and fill ALL required values.
#   2. Place TLS certificates at ./nginx/certs/fullchain.pem and privkey.pem
#      (or mount a Certbot volume — see nginx service comment below).
#   3. Set a strong MYSQL_REPL_PASSWORD in .env.prod.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f
#   docker compose -f docker-compose.prod.yml --env-file .env.prod down
#
# Scaling the app tier (load-balanced by Nginx round-robin DNS):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod \
#       up -d --scale app=3 --no-recreate
# =============================================================================

# ── Shared defaults ──────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  frontend:        # nginx ↔ app
    driver: bridge
  backend:         # app ↔ db-primary, db-replica, redis
    driver: bridge
    internal: true # db and redis are not reachable from outside the host

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  storage:          # client/device/ticket document uploads (/app/storage)
  wg_keys:          # WireGuard server keypairs (persist across redeploys; never in git)
  wg_runtime:       # private app ↔ WireGuard helper Unix socket
  db_primary_data:
  db_replica_data:
  redis_data:
  nginx_certs:
  certbot_www:
  chroma_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── MySQL primary (write node) ──────────────────────────────────────────────
  db-primary:
    image: mysql:8.4.9
    restart: unless-stopped
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE:      ${DB_NAME:-fireisp}
      MYSQL_USER:          ${DB_USER:-fireisp}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_primary_data:/var/lib/mysql
      - ./mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
    command: mysqld --host-cache-size=0
    # NO credentials, on purpose. The old form interpolated ${DB_ROOT_PASSWORD}
    # into this command's argv, and a container process's argv is visible in the
    # HOST's /proc — /proc/<pid>/cmdline is world-readable — so the root DB
    # password was exposed to every local account, refreshed every 10s, forever.
    # `mysqladmin ping` exits 0 whenever the server answers, including with
    # "access denied" (documented: a refused connection proves mysqld is alive),
    # so liveness needs no password. Dev and e2e already use this exact form.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus:   '2'
          memory: 1G
        reservations:
          cpus:   '0.5'
          memory: 256M
    logging: *default-logging

  # ── MySQL replica (read node) ───────────────────────────────────────────────
  db-replica:
    image: mysql:8.4.9
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      db-primary:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD:  ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE:       ${DB_NAME:-fireisp}
      MYSQL_USER:           ${DB_USER:-fireisp}
      MYSQL_PASSWORD:       ${DB_PASSWORD:?DB_PASSWORD is required}
      # Replication credentials
      MYSQL_REPL_USER:      ${MYSQL_REPL_USER:-repl_user}
      MYSQL_REPL_PASSWORD:  ${MYSQL_REPL_PASSWORD:?MYSQL_REPL_PASSWORD is required}
    volumes:
      - db_replica_data:/var/lib/mysql
      - ./mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ./mysql/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    command: mysqld --host-cache-size=0
    # NO credentials, on purpose. The old form interpolated ${DB_ROOT_PASSWORD}
    # into this command's argv, and a container process's argv is visible in the
    # HOST's /proc — /proc/<pid>/cmdline is world-readable — so the root DB
    # password was exposed to every local account, refreshed every 10s, forever.
    # `mysqladmin ping` exits 0 whenever the server answers, including with
    # "access denied" (documented: a refused connection proves mysqld is alive),
    # so liveness needs no password. Dev and e2e already use this exact form.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus:   '2'
          memory: 1G
        reservations:
          cpus:   '0.25'
          memory: 256M
    logging: *default-logging

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      # Read by the entrypoint below and by the healthcheck. An env var is safe:
      # /proc/<pid>/environ is mode 0400 (owner only), unlike argv.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # The password is written into a config file from the environment, NOT put on
    # redis-server's command line. `--requirepass ${REDIS_PASSWORD}` made compose
    # interpolate the plaintext into the container's STORED CONFIGURATION, which
    # is readable via `docker inspect` and written to
    # /var/lib/docker/containers/<id>/config.v2.json on disk — so it also travels
    # into any backup of that directory. It was additionally in the argv of PID 1
    # (a container process's argv is visible in the host's /proc, and
    # /proc/<pid>/cmdline is world-readable, 0444), though only briefly: Redis
    # overwrites its own argv at startup, because set-proc-title defaults to yes
    # and setproctitle reuses the argv memory. The healthcheck below had no such
    # reprieve — redis-cli does not rewrite its title, so `redis-cli -a <pw>`
    # republished the password to every local account every 10 seconds.
    #
    # The old form was also outright BROKEN for such a password, not merely
    # leaky: `command: >` folds to one string that compose splits shell-style, so
    # a `"` in the value made compose refuse the file entirely —
    # "'services[redis].command' invalid command line string". Verified by
    # restoring the old form in CI. This form takes the value through the
    # environment, so no splitter ever sees it.
    #
    # $$REDIS_PASSWORD (doubled) so compose does NOT interpolate it here: the
    # container's shell expands it from the environment into the heredoc, so the
    # value reaches the file and nothing else. Then `docker-entrypoint.sh
    # redis-server ...` is exec'd exactly as the image intends, preserving its
    # chown of /data and its drop to the unprivileged `redis` user (both only
    # happen when arg 1 is `redis-server`). Non-secret tuning stays on argv.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        # redis.conf is parsed by sdssplitargs(), which treats \ and " inside a
        # double-quoted value as syntax. Unescaped, a password containing " (or
        # ending in \) is "Unbalanced quotes in configuration line" -> exit(1),
        # and since app gates on `redis: service_healthy` that crash-loop wedges
        # the WHOLE stack; an interior \ is worse than a crash — Redis starts
        # having silently stored a DIFFERENT password (\n, \xNN are interpreted),
        # so auth fails with everything looking alive. Escaping just \ and " is
        # sufficient: Redis unescapes \" -> " and \\ -> \, and pre-escaping the
        # backslash also neutralises the \n / \xNN forms. Verified against a port
        # of the parser over 11 hostile inputs; all round-trip byte-exact.
        esc=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
        cat > /tmp/redis.conf <<EOF
        requirepass "$$esc"
        EOF
        # 0400 + owned by redis, NOT 0644: the entrypoint drops to the redis user
        # before redis-server reads this file, so it must be readable by redis —
        # but a world-readable plaintext password inside the container undoes the
        # umask above for anything else running there.
        chown redis /tmp/redis.conf || { echo "redis entrypoint: could not give the config to the redis user — refusing to start rather than crash-looping on an unreadable config" >&2; exit 1; }
        chmod 0400 /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory ${REDIS_MAXMEMORY:-256mb} \
          --maxmemory-policy allkeys-lru \
          --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH (env, 0400) instead of `-a <password>` (argv, 0444). The
      # sh -c script text carries only the literal $REDIS_PASSWORD; the value is
      # placed in redis-cli's ENVIRON, never its argv.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          cpus:   '0.5'
          memory: 512M
        reservations:
          cpus:   '0.1'
          memory: 64M
    logging: *default-logging

  # ── FireISP application ───────────────────────────────────────────────────
  app:
    # PULLED, not built. Compiling here is what used to wedge the box: the
    # in-image frontend build (gen:api + a whole-program `tsc --noEmit` over 376
    # files + Vite) peaks around 1.43 GB RSS and `up -d --build` runs it while
    # the whole stack is still resident, so the kernel evicted MySQL's buffer
    # pools into swap. Those pages never came back, swap ratcheted up across
    # deploys, and the machine eventually thrashed hard enough to lock out SSH.
    #
    # CI builds and scans the image, then publishes it (.github/workflows/ci.yml
    # → container-scan). redeploy.sh pins FIREISP_IMAGE to the exact commit SHA,
    # so what runs here always corresponds to a specific commit — and a rollback
    # is a tag change rather than a rebuild.
    #
    # To build locally instead (dev boxes, air-gapped installs, testing an
    # unmerged commit), add the override that restores the build block:
    #   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml --env-file .env.prod up -d --build
    image: ${FIREISP_IMAGE:-ghcr.io/vothalvino/fireisp5.0:latest}
    restart: unless-stopped
    # Least privilege: no `user` override means the image's non-root `fireisp`
    # user runs the web/API application with no added Linux capabilities.
    # This configures the shared network namespace at container creation; it
    # does not grant the app process permission to alter routes or interfaces.
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      - frontend
      - backend
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV:   production
      DB_HOST:    db-primary
      DB_PORT:    3306
      REDIS_URL:  redis://:${REDIS_PASSWORD}@redis:6379
      # Embedded RADIUS server (FireISP is the RADIUS server — docs/radius-server.md).
      # Defaults ON in production; set RADIUS_SERVER_ENABLED=false in .env.prod to disable.
      RADIUS_SERVER_ENABLED: ${RADIUS_SERVER_ENABLED:-true}
      RADIUS_AUTH_PORT:      ${RADIUS_AUTH_PORT:-1812}
      RADIUS_ACCT_PORT:      ${RADIUS_ACCT_PORT:-1813}
      RADIUS_SERVER_SECRET:  ${RADIUS_SERVER_SECRET:-}
      # UDP listener for unsolicited SNMP traps. The non-privileged default is
      # 1620; use a host-port mapping if the host must expose standard port 162.
      SNMP_TRAP_PORT:        ${SNMP_TRAP_PORT:-1620}
      # Bind inside the container; SNMP_TRAP_PUBLISH_IP below restricts the host.
      SNMP_TRAP_BIND_IP:     0.0.0.0
      # The installation-wide GUI setting controls activation. Kernel actions
      # go over this private Unix socket to the isolated helper below.
      WG_SERVER_ENABLED:     'false'
      # One-time upgrade bridge: runtime imports the old env/default into the
      # new DB setting, then the GUI becomes authoritative.
      WG_LEGACY_SERVER_ENABLED: ${WG_SERVER_ENABLED-__unset__}
      WG_HELPER_SOCKET:      /run/fireisp-wireguard/helper.sock
      # "A newer release is available" banner for the install operator. ON by
      # default so a fresh install works with no configuration. This is the only
      # outbound request FireISP makes on its own behalf: an unauthenticated
      # read of the newest public commit — no install data, no telemetry.
      # Set FIREISP_UPDATE_CHECK=0 in .env.prod to switch it off.
      #
      # An env var, NOT a row in `settings`, deliberately: only whoever edits
      # .env.prod can change this, which is exactly the install operator. A
      # settings row would be writable by any tenant's admin.
      FIREISP_UPDATE_CHECK:  ${FIREISP_UPDATE_CHECK:-1}
    volumes:
      # Named volume, NOT a host bind mount: the previous `./storage` bind mount
      # was root-owned on the host, so the non-root `fireisp` container user hit
      # EACCES writing uploads. A named volume inherits the image's fireisp-owned
      # /app/storage on first init, so it is writable by the app.
      - storage:/app/storage
      - wg_runtime:/run/fireisp-wireguard:ro
    # HTTP (3000) stays internal behind Nginx. RADIUS and SNMP trap listeners
    # are UDP and must be published directly (Nginx proxies HTTP only).
    # NOTE: these are fixed host ports — keep the app at replicas:1, or front
    # the RADIUS/SNMP listeners with a UDP load balancer if you scale the app
    # tier (--scale app=N).
    expose:
      - '3000'
    ports:
      - '${RADIUS_AUTH_PORT:-1812}:1812/udp'
      - '${RADIUS_ACCT_PORT:-1813}:1813/udp'
      - '${SNMP_TRAP_PUBLISH_IP:-127.0.0.1}:${SNMP_TRAP_PORT:-1620}:${SNMP_TRAP_PORT:-1620}/udp'
      # Inert while the GUI setting is off: no WireGuard interface listens.
      # Publishing them here lets the GUI activate the hub without recreating
      # containers or requiring shell access.
      - '${WG_LISTEN_PORT:-51820}:${WG_LISTEN_PORT:-51820}/udp'
      - '${WG_CLIENT_LISTEN_PORT:-51821}:${WG_CLIENT_LISTEN_PORT:-51821}/udp'
    deploy:
      replicas: 1          # increase with --scale app=N as traffic grows
      resources:
        limits:
          cpus:   '1'
          memory: 512M
        reservations:
          cpus:   '0.25'
          memory: 128M
    logging: *default-logging

  # ── WireGuard kernel helper ───────────────────────────────────────────────
  # The public app stays non-root. This deliberately small process receives no
  # DB, Redis, JWT, or encryption secrets and accepts only named WireGuard
  # operations over a Unix socket mounted solely into these two containers.
  wireguard-helper:
    image: ${FIREISP_IMAGE:-ghcr.io/vothalvino/fireisp5.0:latest}
    restart: unless-stopped
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: service:app
    depends_on:
      app:
        condition: service_started
    command: ['node', 'src/scripts/wireguard-helper.js']
    environment:
      NODE_ENV: production
      WG_PRIVILEGED_HELPER: 'true'
      WG_SERVER_ENABLED: 'true'
      WG_KEY_DIR: /etc/wireguard
      WG_SERVER_INTERFACE: ${WG_SERVER_INTERFACE:-wg-fireisp}
      WG_SERVER_SUBNET: ${WG_SERVER_SUBNET:-10.255.0.0/16}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_CLIENT_INTERFACE: ${WG_CLIENT_INTERFACE:-wg-clients}
      WG_CLIENT_SUBNET: ${WG_CLIENT_SUBNET:-10.99.0.0/16}
      WG_CLIENT_LISTEN_PORT: ${WG_CLIENT_LISTEN_PORT:-51821}
      WG_HELPER_SOCKET: /run/fireisp-wireguard/helper.sock
    volumes:
      - wg_keys:/etc/wireguard
      - wg_runtime:/run/fireisp-wireguard
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ['CMD', 'node', '-e', "const n=require('net').connect('/run/fireisp-wireguard/helper.sock');n.on('connect',()=>process.exit(0));n.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    # On startup: auto-generate a self-signed certificate when no real TLS
    # certificate is present yet (e.g. before init-letsencrypt.sh has been
    # run).  This lets nginx bind on port 80 immediately so the container is
    # healthy and can serve the Let's Encrypt ACME HTTP-01 challenge.
    # The self-signed cert is overwritten by init-letsencrypt.sh / certbot.
    # Reload nginx every 6 hours so it picks up renewed TLS certificates
    # without requiring a container restart. Let's Encrypt renews ~30 days
    # before expiry; the 6-hour window guarantees fresh certs within hours.
    command:
      - /bin/sh
      - -c
      - |
          if [ ! -f /etc/nginx/certs/fullchain.pem ] || [ ! -f /etc/nginx/certs/privkey.pem ]; then
            mkdir -p /etc/nginx/certs;
            # nginx:alpine ships the OpenSSL libraries but not the openssl CLI.
            # Install it transiently (apk cache is discarded after this container
            # restarts, keeping the image immutable).
            if ! command -v openssl >/dev/null 2>&1; then
              apk add --no-cache openssl >/dev/null;
            fi;
            openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
              -keyout /etc/nginx/certs/privkey.pem \
              -out    /etc/nginx/certs/fullchain.pem \
              -subj   /CN=localhost 2>/dev/null; # bootstrap-only; replaced by init-letsencrypt.sh
            echo "[nginx] Self-signed cert created. Run nginx/init-letsencrypt.sh for a real cert.";
          fi;
          while :; do sleep 6h & wait $${!}; nginx -s reload; done &
          exec nginx -g "daemon off;"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates directory — populated by:
      #   • The startup command above (temporary self-signed cert when missing)
      #   • init-letsencrypt.sh   (first-time real certificate bootstrap)
      #   • certbot-deploy-hook.sh (automatic renewal copy)
      #   • Manual: place fullchain.pem + privkey.pem here directly
      # Not mounted read-only so the startup command can write the initial
      # self-signed certificate when no real certificate is present yet.
      - ./nginx/certs:/etc/nginx/certs
      # Certbot ACME challenge web-root (HTTP-01 challenge)
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/healthz || exit 1']
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus:   '0.5'
          memory: 128M
        reservations:
          cpus:   '0.1'
          memory: 32M
    logging: *default-logging

  # ── ChromaDB vector store (optional — enable with --profile rag) ─────────
  chromadb:
    image: chromadb/chroma:1.0.4
    profiles: ['rag']
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: 'TRUE'
      ANONYMIZED_TELEMETRY: 'FALSE'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/api/v1/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
  # This service checks for certificate renewal every 12 hours.
  # Let's Encrypt renews certs that are within 30 days of expiry.
  #
  # First-time setup: run nginx/init-letsencrypt.sh instead of starting
  # this service directly — it handles the chicken-and-egg bootstrapping.
  certbot:
    # Pinned: :latest can change underneath an operator with no warning, and a
    # broken renewal stays invisible until the certificate actually expires.
    #
    # HTTP-01 (webroot) only. DNS-01 support was removed 2026-07-26 — it was
    # Cloudflare-specific, unused, and speculative capability in the TLS
    # renewal path is capability that can rot unnoticed. If DNS-01 is ever
    # needed, the renewal image MUST carry the matching plugin: `certbot renew`
    # reads the authenticator back out of /etc/letsencrypt/renewal/<domain>.conf
    # and fails without it, silently, until the certificate expires.
    # tests/tlsRenewalConfig.test.js enforces exactly that.
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    # Renewal loop: check every 12 hours. certbot renew is a no-op when
    # the certificate is not yet due for renewal (< 30 days to expiry).
    #
    # NOT --quiet, deliberately. With --quiet a failing renewal printed nothing,
    # `restart: unless-stopped` kept the loop going, and nothing else watched
    # TLS expiry — so the first symptom would be the portal serving an expired
    # certificate ~60-90 days later. The output now reaches the container log
    # via the shared logging driver. Active alerting on expiry is a separate
    # piece of work (see the TLS expiry monitor).
    entrypoint: >
      /bin/sh -c
      'trap exit TERM;
       while :; do
         certbot renew;
         sleep 12h & wait $${!};
       done'
    volumes:
      # Let's Encrypt config + issued certificates (local bind-mount so the
      # directory is visible on the host and easy to inspect/backup)
      - ./nginx/letsencrypt:/etc/letsencrypt
      # HTTP-01 ACME challenge web-root (shared with nginx)
      - certbot_www:/var/www/certbot
      # Shared certs dir: deploy hook copies renewed certs here so nginx
      # can read them without mounting the full /etc/letsencrypt tree
      - ./nginx/certs:/certs
      # Deploy hook: runs automatically on successful renewal
      - ./nginx/certbot-deploy-hook.sh:/etc/letsencrypt/renewal-hooks/deploy/copy-certs.sh:ro
    logging: *default-logging
