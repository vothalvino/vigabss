apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fireisp
  namespace: fireisp
  labels:
    app.kubernetes.io/name: fireisp
    app.kubernetes.io/component: api
spec:
  # maxUnavailable, not minAvailable: 1 — with a single replica the latter
  # blocks every node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fireisp
      app.kubernetes.io/component: api
