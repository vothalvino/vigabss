apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fireisp
  namespace: fireisp
  labels:
    app.kubernetes.io/name: fireisp
    app.kubernetes.io/component: api
  annotations:
    # Uncomment for cert-manager TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  # TLS is required: the auth cookies are Secure in production, so a login over
  # plain HTTP cannot keep its session (OPS-17). Create the fireisp-tls secret,
  # or let cert-manager issue it (annotation above).
  tls:
    - hosts:
        - vigabss.example.com
      secretName: fireisp-tls
  rules:
    - host: vigabss.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fireisp
                port:
                  name: http
