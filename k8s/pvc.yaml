apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigabss-storage
  namespace: vigabss
  labels:
    app.kubernetes.io/name: vigabss
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uncomment and set your storage class:
  # storageClassName: gp3
