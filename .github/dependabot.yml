# Dependency update pull requests (OPS-07, OPS-08). Version updates are
# grouped and weekly so they arrive as a few reviewable PRs; security updates
# are separate and immediate. github-actions keeps the commit-SHA pins in the
# workflows current (each pin carries its tag in a comment).
#
# Major versions are not proposed automatically: a new MySQL, Redis or Node
# line, or a new build toolchain (TypeScript, Vite, Vitest), is a planned
# upgrade with its own testing, not a one-click merge. nginx stays on its
# even-numbered stable line, so only its patch releases are proposed.
version: 2
updates:
  # One entry for the whole pnpm workspace (root, frontend, e2e): the only
  # lockfile is the root pnpm-lock.yaml. A separate /frontend entry produced
  # PRs that changed frontend/package.json without the lockfile, which every
  # `pnpm install --frozen-lockfile` build refused.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's base image (node).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The third-party images in the compose files, pinned by version and digest
  # (OPS-12).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Follows the playwright npm package, not its own release train: bump it
      # in the same PR as @playwright/test (dependency-scan checks they match).
      - dependency-name: "mcr.microsoft.com/playwright"
