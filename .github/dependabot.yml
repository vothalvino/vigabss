# Dependency update pull requests (OPS-07, OPS-08). Version updates are
# grouped and weekly so they arrive as a few reviewable PRs; security updates
# are separate and immediate. github-actions keeps the commit-SHA pins in the
# workflows current (each pin carries its tag in a comment).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The third-party images in the compose files, pinned by version and digest
  # (OPS-12).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

