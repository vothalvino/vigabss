name: Test diagnostics

# The main test run used --detectOpenHandles, which forces jest to run every
# suite in one process; with --forceExit it only prints the handles it finds
# and never fails, so it cost ~10 minutes of every main run. That report runs
# here instead, weekly and on demand: the full suite in band with handle
# detection, its log kept as an artifact. Read it for timers, sockets or
# servers a test leaves open; it does not gate anything.

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC, after the security scan
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  open-handles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with open-handle detection
        env:
          NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169 --max-old-space-size=10240
        run: pnpm exec jest --detectOpenHandles --forceExit --ci 2>&1 | tee open-handles.log

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-handles-report
          path: open-handles.log
          retention-days: 30
