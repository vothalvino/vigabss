name: Security scan

# Advisories are published between commits. CI only scanned on a push or PR,
# so a new HIGH in the lockfile or the shipped image surfaced whenever the
# next unrelated change happened to run (OPS-07). This re-scans weekly, and
# on demand, and opens an issue when something blocking appears.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_IMAGE: ghcr.io/vothalvino/vigabss
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # pull the published image
      security-events: write  # publish SARIF to code scanning
      issues: write           # open an issue when a blocking finding appears
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the lockfile (production dependencies)
        id: fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          version: v0.71.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan the published image
        id: image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}:latest
          format: table
          version: v0.71.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Full image report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}:latest
          format: sarif
          output: trivy-scheduled.sarif
          version: v0.71.1
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Publish SARIF to code scanning
        if: always() && hashFiles('trivy-scheduled.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-scheduled

      - name: Open an issue for a blocking finding
        if: steps.fs.outcome == 'failure' || steps.image.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FS: ${{ steps.fs.outcome }}
          IMAGE: ${{ steps.image.outcome }}
        run: |
          set -euo pipefail
          title="Scheduled security scan: fixable HIGH/CRITICAL finding"
          body="The weekly Trivy scan found a fixable HIGH or CRITICAL vulnerability (lockfile: ${FS}, published image: ${IMAGE}). The next PR's container-scan will block on it. Details: ${RUN_URL}"
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the run so it shows red
        if: steps.fs.outcome == 'failure' || steps.image.outcome == 'failure'
        run: exit 1

  third-party-image-list:
    # Read from docker-compose.prod.yml, so a Dependabot pin bump is scanned
    # without editing this file (a copied list went stale on every bump).
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the third-party images
        id: list
        run: |
          set -euo pipefail
          images=$(grep -E '^\s+image:\s' docker-compose.prod.yml | awk '{print $2}' | grep -v 'VIGABSS_IMAGE' | sort -u \
            | jq -R . | jq -sc .)
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "$images"

  third-party-images:
    # The images the compose files run besides the app (OPS-12). Report-only:
    # upstream images often carry findings this repository cannot fix, so they
    # go to code scanning instead of failing the run.
    needs: third-party-image-list
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.third-party-image-list.outputs.images) }}
    steps:
      - name: Name the report
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "slug=$(echo "${IMAGE%%@*}" | tr '/:.' '---')" >> "$GITHUB_OUTPUT"

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-third-party.sarif
          version: v0.71.1
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: 0
          vuln-type: os,library
          ignore-unfixed: true

      - name: Publish SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-third-party.sarif
          category: trivy-${{ steps.name.outputs.slug }}

