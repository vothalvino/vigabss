name: Security scan

# Advisories are published between commits. CI only scanned on a push or PR,
# so a new HIGH in the lockfile or the shipped image surfaced whenever the
# next unrelated change happened to run (OPS-07). This re-scans weekly, and
# on demand, and opens an issue when something blocking appears.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_IMAGE: ghcr.io/vothalvino/vigabss
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # pull the published image
      security-events: write  # publish SARIF to code scanning
      issues: write           # open an issue when a blocking finding appears
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Scan the lockfile (production dependencies)
        id: fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          version: v0.71.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan the published image
        id: image
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}:latest
          format: table
          version: v0.71.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Full image report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}:latest
          format: sarif
          output: trivy-scheduled.sarif
          version: v0.71.1
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Publish SARIF to code scanning
        if: always() && hashFiles('trivy-scheduled.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-scheduled

      - name: Open an issue for a blocking finding
        if: steps.fs.outcome == 'failure' || steps.image.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FS: ${{ steps.fs.outcome }}
          IMAGE: ${{ steps.image.outcome }}
        run: |
          set -euo pipefail
          title="Scheduled security scan: fixable HIGH/CRITICAL finding"
          body="The weekly Trivy scan found a fixable HIGH or CRITICAL vulnerability (lockfile: ${FS}, published image: ${IMAGE}). The next PR's container-scan will block on it. Details: ${RUN_URL}"
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the run so it shows red
        if: steps.fs.outcome == 'failure' || steps.image.outcome == 'failure'
        run: exit 1
