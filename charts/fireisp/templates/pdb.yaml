{{- /* A minAvailable: 1 budget on a single replica blocks every node drain. */ -}}
{{- if and .Values.pdb.enabled (or (gt (int .Values.replicaCount) 1) .Values.hpa.enabled) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fireisp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fireisp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fireisp.selectorLabels" . | nindent 6 }}
{{- end }}
