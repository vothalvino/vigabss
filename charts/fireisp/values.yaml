# Default values for fireisp Helm chart.
# Override these in a values file or with --set flags.

## Number of application replicas.
replicaCount: 2

image:
  ## What CI publishes, and what templates/cosign-policy.yaml verifies.
  ## The old default (fireisp/fireisp) resolved to Docker Hub, a namespace
  ## this project does not control, and never matched the signature policy.
  repository: ghcr.io/vothalvino/fireisp5.0
  ## Required for installs from the source tree: use a full commit SHA published
  ## by main CI. The version-tag workflow injects its verified X.Y.Z image into
  ## the packaged release chart only after that image exists.
  tag: ""
  pullPolicy: IfNotPresent

## Optional image pull secrets (e.g. for private registries).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  ## Set to true to create a ServiceAccount.
  create: false
  name: ""
  annotations: {}

## Pod annotations (e.g. for Prometheus scraping).
podAnnotations: {}

## Pod labels.
podLabels: {}

## Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

## Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## Database migrations may tighten invariants that an older application cannot
## honor. Recreate drains every old pod before a new-image init migration runs.
## This deliberately creates a short maintenance window instead of overlapping
## legacy writers/listeners with the upgraded schema.
strategy:
  type: Recreate

terminationGracePeriodSeconds: 30

## Run database migrations in an init container before each new application
## pod can bind HTTP/RADIUS/SNMP listeners. Concurrent rollout pods serialize
## through the migration runner's database advisory lock.
migration:
  enabled: true
  migrateIsolatedTenants: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

## Optional UDP service for unsolicited SNMP traps. Keep this disabled until
## the load balancer/firewall is restricted to trusted device-management
## networks. Network devices normally send to port 162; FireISP listens on the
## non-privileged container port configured by SNMP_TRAP_PORT (default 1620).
snmpTrap:
  enabled: false
  type: LoadBalancer
  port: 162
  nodePort: null
  externalTrafficPolicy: Local
  annotations: {}
  loadBalancerSourceRanges: []
  ## Unsafe escape hatch for environments whose trusted-source ACL is enforced
  ## outside Kubernetes (including NodePort). Never enable without that ACL.
  allowUnrestrictedSources: false

ingress:
  enabled: true
  className: nginx
  ## Hostname for the Ingress rule.
  hostname: fireisp.example.com
  ## Annotations added to the Ingress resource.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  tls:
    enabled: false
    ## Name of the TLS secret. Leave blank to use "<fullname>-tls".
    secretName: ""
    ## cert-manager ClusterIssuer name (adds annotation when set).
    clusterIssuer: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

## Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

## Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

## Persistent storage for uploads / generated files.
persistence:
  enabled: true
  size: 10Gi
  ## Leave blank to use the cluster default StorageClass.
  storageClassName: ""
  accessMode: ReadWriteOnce

## Liveness / readiness / startup probes.
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

## Non-secret configuration (rendered into a ConfigMap).
## All values must be strings.
config:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"

  RATE_LIMIT_API: "200"
  RATE_LIMIT_AUTH: "20"
  RATE_LIMIT_EXPORT: "20"
  RATE_LIMIT_SSE: "10"
  RATE_LIMIT_WEBHOOK: "100"

  REQUEST_TIMEOUT_MS: "30000"

  ## Feature flags
  FEATURE_CFDI: "true"
  FEATURE_RADIUS: "true"
  FEATURE_2FA: "true"
  FEATURE_WEBHOOKS: "true"
  FEATURE_SNMP: "true"
  FEATURE_SSO: "false"

  ## Internal UDP listener used by the optional snmpTrap Service.
  SNMP_TRAP_PORT: "1620"
  ## Loopback unless the opt-in snmpTrap Service is enabled; the Deployment
  ## then overrides this to 0.0.0.0 behind the chart's source-range guard.
  SNMP_TRAP_BIND_IP: "127.0.0.1"
  ## Fixed-memory overload and graceful-drain limits for unauthenticated UDP.
  SNMP_TRAP_MAX_IN_FLIGHT: "16"
  SNMP_TRAP_RATE_PER_SECOND: "50"
  SNMP_TRAP_RATE_BURST: "100"
  SNMP_TRAP_RATE_PER_MINUTE: "600"
  SNMP_TRAP_RATE_MINUTE_BURST: "120"
  SNMP_TRAP_SOURCE_RATE_PER_MINUTE: "10"
  SNMP_TRAP_SOURCE_RATE_BURST: "20"
  SNMP_TRAP_ORG_DAILY_ROW_LIMIT: "10000"
  SNMP_TRAP_GLOBAL_DAILY_ROW_LIMIT: "100000"
  SNMP_TRAP_ORG_DAILY_VARBIND_BYTES: "16777216"
  SNMP_TRAP_GLOBAL_DAILY_VARBIND_BYTES: "134217728"
  SNMP_TRAP_ORG_DAILY_DELIVERY_LIMIT: "10000"
  SNMP_TRAP_GLOBAL_DAILY_DELIVERY_LIMIT: "100000"
  SNMP_TRAP_LOCAL_QUEUE_CAPACITY: "100"
  SNMP_TRAP_DRAIN_TIMEOUT_MS: "10000"

  ## Embedded RADIUS server (FireISP answers RADIUS auth/accounting itself —
  ## docs/radius-server.md). Off by default here; to expose it externally on
  ## Kubernetes you must also add UDP 1812/1813 to the Service + container ports
  ## (follow-up — the chart Service is HTTP/TCP only today).
  RADIUS_SERVER_ENABLED: "false"
  RADIUS_AUTH_PORT: "1812"
  RADIUS_ACCT_PORT: "1813"

  FIRERELAY_MODE: "standalone"

## Secret values (rendered into a Kubernetes Secret).
## In production use Sealed Secrets or External Secrets Operator instead of
## plain values here — see docs/secrets-management.md.
secrets:
  JWT_SECRET: "REPLACEME-generate-a-random-64-char-string"
  ENCRYPTION_KEY: "REPLACEME-generate-a-random-32-byte-hex-key"
  DB_HOST: "mysql.fireisp.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "fireisp"
  DB_USER: "fireisp"
  DB_PASSWORD: "REPLACEME-database-password"

## Prometheus monitoring resources (requires Prometheus Operator CRDs).
monitoring:
  enabled: false

## Sigstore cosign policy (requires policy-controller CRDs).
cosignPolicy:
  enabled: false

## Arbitrary extra environment variables injected into the container.
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

## Extra volumes and volume mounts.
extraVolumes: []
extraVolumeMounts: []

## Node selector, tolerations, and affinity.
nodeSelector: {}
tolerations: []
affinity: {}
